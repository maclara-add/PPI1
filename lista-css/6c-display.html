<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6c - Position</title>
    <style>
        /*
        O .area tem position: relative, então vira a referência dos
        filhos. Cada box usa position: absolute e é colocado com
        top/bottom/left/right, saindo do fluxo normal da página.
        O box 3 usa top/left 50% com transform para ficar no centro.
        */
        .area {
            position: relative;
            width: 100%;
            height: 100vh;
        }
        .box {
            position: absolute;
            width: 80px;
            height: 80px;
            font-size: 10px;
        }
        #box1 { top: 0; left: 0; background-color: red; }
        #box2 { top: 0; right: 0; background-color: yellow; }
        #box3 {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: magenta;
        }
        #box4 { bottom: 0; left: 0; background-color: blue; }
        #box5 { bottom: 0; right: 0; background-color: green; }
    </style>
</head>
<body>
    <div class="area">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>
    </div>
</body>
</html>
