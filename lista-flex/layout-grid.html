<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3 - Layout com grid</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        .grade {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            grid-template-rows: repeat(4, 1fr);
            grid-template-areas:
                "item1 item1 item1"
                "item2 item3 item4"
                "item5 item3 item6"
                "item5 item7 item7";
            gap: 6px;
            width: 600px;
            height: 400px;
        }
        .grade div {
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            background-color: #ffd780;
        }
        #item1 { grid-area: item1; }
        #item2 { grid-area: item2; background-color: #f24664; }
        #item3 { grid-area: item3; }
        #item4 { grid-area: item4; background-color: #f24664; }
        #item5 { grid-area: item5; }
        #item6 { grid-area: item6; background-color: #f24664; }
        #item7 { grid-area: item7; }
    </style>
</head>
<body>
    <div class="grade">
        <div id="item1">1</div>
        <div id="item2">2</div>
        <div id="item3">3</div>
        <div id="item4">4</div>
        <div id="item5">5</div>
        <div id="item6">6</div>
        <div id="item7">7</div>
    </div>
</body>
</html>
