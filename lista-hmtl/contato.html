<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Contato</title>
</head>
<body>
    <div>
        <a href="curriculo.html">Voltar ao Currículo</a> | 
        <a href="index.html">Página Inicial</a>
    </div>

    <h1>Entre em Contato</h1>
    <p>Por favor, preencha o formulário abaixo com suas informações e mensagem. Todos os campos sinalizados com asterisco (*) são de preenchimento obrigatório.</p>
    <hr>

    <form action="#" method="get">
        <p>
            <label for="nome">Nome Completo *:</label><br>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
        </p>

        <p>
            <label for="email">E-mail *:</label><br>
            <input type="email" id="email" name="email" placeholder="seuemail@dominio.com" required>
        </p>

        <p>
            <label for="assunto">Assunto:</label><br>
            <input type="text" id="assunto" name="assunto" placeholder="Motivo do contato">
        </p>

        <p>
            <label for="estado">Estado:</label><br>
            <select id="estado" name="estado">
                <option value="">Selecione um estado</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">São Paulo</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="PR">Paraná</option>
                <option value="RS">Rio Grande do Sul</option>
            </select>
        </p>

        <p>
            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="5" cols="40" placeholder="Escreva sua mensagem aqui..."></textarea>
        </p>

        <p>
            <button type="submit">Enviar Mensagem</button>
        </p>
    </form>
</body>
</html>
